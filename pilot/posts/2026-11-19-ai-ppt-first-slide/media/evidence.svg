<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <rect width="1200" height="1500" fill="#F5F2EA"/>
  <text x="80" y="95" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="700" fill="#657468">AI 냠냠 · 가상 캠페인 3장 목차</text>
  <text x="80" y="185" font-family="Malgun Gothic, sans-serif" font-size="60" font-weight="800" fill="#172038">예쁜 요약보다</text>
  <text x="80" y="262" font-family="Malgun Gothic, sans-serif" font-size="60" font-weight="800" fill="#172038">결정을 돕는 세 장</text>

  <rect x="70" y="330" width="1060" height="155" rx="28" fill="#E7EEF8"/>
  <text x="110" y="390" font-family="Malgun Gothic, sans-serif" font-size="31" font-weight="800" fill="#24456C">가상 원문</text>
  <text x="110" y="447" font-family="Malgun Gothic, sans-serif" font-size="36" font-weight="700" fill="#172038">신청 10→12건 · 광고비 100→120만원 · 나머지는 미확인</text>

  <rect x="70" y="540" width="1060" height="225" rx="30" fill="#FFF" stroke="#6A93C5" stroke-width="5"/>
  <circle cx="135" cy="605" r="38" fill="#2D66A2"/>
  <text x="135" y="620" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="34" font-weight="800" fill="#FFF">1</text>
  <text x="205" y="610" font-family="Malgun Gothic, sans-serif" font-size="43" font-weight="800" fill="#172038">무엇이 달라졌나</text>
  <text x="205" y="675" font-family="Malgun Gothic, sans-serif" font-size="34" fill="#34435A">신청과 비용이 함께 20% 증가</text>
  <text x="205" y="725" font-family="Malgun Gothic, sans-serif" font-size="34" font-weight="700" fill="#2D66A2">→ 예산 확대 판단이 필요합니다</text>

  <rect x="70" y="800" width="1060" height="225" rx="30" fill="#FFF" stroke="#70A88B" stroke-width="5"/>
  <circle cx="135" cy="865" r="38" fill="#3B7A55"/>
  <text x="135" y="880" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="34" font-weight="800" fill="#FFF">2</text>
  <text x="205" y="870" font-family="Malgun Gothic, sans-serif" font-size="43" font-weight="800" fill="#172038">왜 그런가</text>
  <text x="205" y="935" font-family="Malgun Gothic, sans-serif" font-size="34" fill="#34435A">확인된 원인과 [미확인]을 분리</text>
  <text x="205" y="985" font-family="Malgun Gothic, sans-serif" font-size="34" font-weight="700" fill="#3B7A55">→ 없는 수치는 만들지 않습니다</text>

  <rect x="70" y="1060" width="1060" height="225" rx="30" fill="#FFF" stroke="#B78A4B" stroke-width="5"/>
  <circle cx="135" cy="1125" r="38" fill="#946A31"/>
  <text x="135" y="1140" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="34" font-weight="800" fill="#FFF">3</text>
  <text x="205" y="1130" font-family="Malgun Gothic, sans-serif" font-size="43" font-weight="800" fill="#172038">오늘 결정할 일</text>
  <text x="205" y="1195" font-family="Malgun Gothic, sans-serif" font-size="34" fill="#34435A">예산 유지·확대·추가 확인 중 선택</text>
  <text x="205" y="1245" font-family="Malgun Gothic, sans-serif" font-size="34" font-weight="700" fill="#946A31">→ 선택지와 담당자를 남깁니다</text>

  <rect x="70" y="1315" width="1060" height="80" rx="24" fill="#172038"/>
  <text x="600" y="1367" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="31" font-weight="800" fill="#FFF">첫 장의 숫자보다 먼저, 회의에서 내릴 결정을 적습니다.</text>
  <text x="600" y="1435" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="30" fill="#68736B">자체 제작한 가상 예시 · 실제 ChatGPT Slides 화면 아님</text>
  <text x="600" y="1478" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#68736B">기준일 2026-11-19</text>
</svg>
